name: Allotment
options:
  bundleIdPrefix: com.rhysellwood
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Allotment:
    type: application
    platform: macOS
    sources:
      - path: Allotment
    info:
      path: Allotment/Info.plist
      properties:
        CFBundleDisplayName: Allotment
        CFBundleName: Allotment
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright 2026 Rhys Ellwood"
        NSCalendarsFullAccessUsageDescription: "Allotment reads your calendar events so you can turn meetings into time entries. Your calendar data never leaves this Mac."
        NSCalendarsUsageDescription: "Allotment reads your calendar events so you can turn meetings into time entries. Your calendar data never leaves this Mac."
    entitlements:
      path: Allotment/Allotment.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        # The app was first called TimeTraka. The identifier keeps that name so the saved data,
        # Keychain items, calendar permission and login item all carry over.
        PRODUCT_BUNDLE_IDENTIFIER: com.rhysellwood.TimeTraka
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  AllotmentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AllotmentTests
    dependencies:
      - target: Allotment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhysellwood.AllotmentTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Allotment:
    build:
      targets:
        Allotment: all
        AllotmentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AllotmentTests
